name: Publish personal home to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/telemetry.json'
      - 'src/data/telemetry_source.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PUBLIC_LESSON_API_URL: ${{ vars.PUBLIC_LESSON_API_URL }}
  PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify public source has no credential patterns
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          if grep -RInE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{25,}' --exclude-dir=.git .; then
            echo 'POTENTIAL_SECRET_MATERIAL_DETECTED' >&2
            exit 1
          fi
      - name: Install dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Intake contracts and local SQL regression
        run: npm run test:intake
      - name: Astro type and build gate
        run: npm run build
      - name: Public identity, links, content and contrast contracts
        run: npm run test:static
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser personal navigation and compatibility
        run: npm run test:e2e
      - name: Desktop, tablet and mobile geometry and captures
        run: npm run test:fresh-eyes
      - name: Lighthouse desktop/mobile gate
        shell: bash
        run: |
          set -euo pipefail
          npm run preview > /tmp/personal-home-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321/ > /dev/null
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          timeout 240s npx lhci autorun --config=./lighthouserc.desktop.cjs
          timeout 240s npx lhci autorun --config=./lighthouserc.mobile.cjs
      - name: Upload browser and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-home-ui-evidence
          path: |
            artifacts/fresh-eyes
            artifacts/lighthouse
            artifacts/playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate, intake-ui]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies from lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Identify the exact release
        run: python3 scripts/verify-publication.py --prepare
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the live release and retired dashboard assets
        env:
          PUBLICATION_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify-publication.py --url "$PUBLICATION_URL"
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-receipt
          path: artifacts/publication-receipt.json
          if-no-files-found: warn
          retention-days: 14


  intake-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_LESSON_API_URL: https://intake-test.example.workers.dev/v1/lesson-requests
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Configured form UI with intercepted external providers; no real submissions
        run: npm run test:intake-ui
