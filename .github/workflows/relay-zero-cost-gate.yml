name: Retired technical routes gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Verify retired routes are absent from the deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/relay
          test ! -e dist/protocol
          echo 'LEGACY_ROUTES_RETIRED'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Retired technical route HTTP regression
        run: npm run test:relay
